basePath: /api/v1
definitions:
  api.APIVersion:
    properties:
      major:
        example: 1
        type: integer
      minor:
        example: 8
        type: integer
    type: object
  api.ActiveWalletRequestResponse:
    properties:
      id:
        type: string
      kind:
        enum:
        - connection
        - transaction
        type: string
      phase:
        enum:
        - ready
        - calling
        - interrupted_calling
        type: string
    type: object
  api.BrowserAuthorizeRequest:
    properties:
      ticket:
        type: string
    type: object
  api.BrowserGrantListResponse:
    properties:
      grants:
        items:
          $ref: '#/definitions/api.BrowserGrantResponse'
        type: array
      nextAfter:
        type: string
    type: object
  api.BrowserGrantResponse:
    properties:
      expiresAt:
        format: date-time
        type: string
      id:
        type: string
      issuedAt:
        format: date-time
        type: string
      revokedAt:
        format: date-time
        type: string
      state:
        enum:
        - active
        - expired
        - revoked
        - not_yet_valid
        type: string
    type: object
  api.BrowserRevokeRequest:
    properties:
      all:
        type: boolean
      id:
        type: string
    type: object
  api.BrowserRevokeResponse:
    properties:
      state:
        example: revoked
        type: string
    type: object
  api.BrowserTicketResponse:
    properties:
      expiresAt:
        format: date-time
        type: string
      url:
        type: string
    type: object
  api.ConnectionBeginCallRequest:
    properties:
      callId:
        type: string
      id:
        type: string
      previousCallId:
        type: string
    required:
    - callId
    - id
    type: object
  api.ConnectionCallPermitResponse:
    properties:
      execution:
        $ref: '#/definitions/api.ConnectionExecutionResponse'
      invoke:
        type: boolean
    type: object
  api.ConnectionConsentRequest:
    properties:
      account:
        type: string
      chainId:
        example: "0x47"
        type: string
      id:
        type: string
      wallet:
        $ref: '#/definitions/api.WalletResponse'
    required:
    - account
    - chainId
    - id
    - wallet
    type: object
  api.ConnectionCreateRequest:
    properties:
      chainId:
        example: "71"
        type: string
      chainName:
        type: string
      clientName:
        example: Example CLI
        type: string
      id:
        type: string
      intent:
        type: string
    required:
    - chainId
    - clientName
    - id
    type: object
  api.ConnectionExecutionRecoverRequest:
    properties:
      id:
        type: string
      previousId:
        type: string
    required:
    - id
    - previousId
    type: object
  api.ConnectionExecutionRequest:
    properties:
      id:
        type: string
    required:
    - id
    type: object
  api.ConnectionExecutionResponse:
    properties:
      callId:
        type: string
      connectionId:
        type: string
      id:
        type: string
      lastSeenAt:
        format: date-time
        type: string
      phase:
        enum:
        - ready
        - calling
        - interrupted_ready
        - interrupted_calling
        - finished
        type: string
    type: object
  api.ConnectionResponse:
    properties:
      chainId:
        example: "0x47"
        type: string
      chainName:
        type: string
      clientName:
        type: string
      createdAt:
        format: date-time
        type: string
      expiresAt:
        format: date-time
        type: string
      finishedAt:
        format: date-time
        type: string
      id:
        type: string
      intent:
        type: string
      sessionId:
        type: string
      state:
        enum:
        - pending
        - succeeded
        - rejected
        - canceled
        - expired
        type: string
    type: object
  api.ConnectionReturnCallRequest:
    properties:
      callId:
        type: string
      id:
        type: string
    required:
    - callId
    - id
    type: object
  api.ErrorResponse:
    properties:
      code:
        example: unauthenticated
        type: string
      message:
        example: A valid Bearer token is required
        type: string
    type: object
  api.InfoResponse:
    properties:
      apiVersion:
        $ref: '#/definitions/api.APIVersion'
      capabilities:
        example:
        - service.status
        - service.stop
        - browser.authorization
        - service.auth.shared
        - connections.lifecycle
        - browser.connections.coordination
        - browser.connections.decisions
        - browser.wallet-operation
        - transactions.lifecycle
        items:
          type: string
        type: array
      challenge:
        type: string
      name:
        example: wallet-bridge
        type: string
      proof:
        type: string
      ready:
        example: true
        type: boolean
      version:
        example: dev
        type: string
    type: object
  api.SessionResponse:
    properties:
      account:
        type: string
      chainId:
        example: "0x47"
        type: string
      closedAt:
        format: date-time
        type: string
      connectionId:
        type: string
      createdAt:
        format: date-time
        type: string
      id:
        type: string
      lastAccessAt:
        format: date-time
        type: string
      state:
        enum:
        - active
        - closed
        type: string
      wallet:
        $ref: '#/definitions/api.WalletResponse'
    type: object
  api.StatusResponse:
    properties:
      activeWalletRequest:
        $ref: '#/definitions/api.ActiveWalletRequestResponse'
      browser:
        $ref: '#/definitions/api.BrowserGrantResponse'
      info:
        $ref: '#/definitions/api.InfoResponse'
      startedAt:
        format: date-time
        type: string
      state:
        example: running
        type: string
      walletOperation:
        $ref: '#/definitions/api.WalletOperationResponse'
    type: object
  api.StopResponse:
    properties:
      state:
        example: stopping
        type: string
    type: object
  api.TransactionCreateRequest:
    properties:
      clientName:
        type: string
      id:
        type: string
      intent:
        description: Optional caller-supplied description, displayed separately from
          the transaction fields.
        type: string
      sessionId:
        type: string
      transaction:
        type: object
    required:
    - clientName
    - id
    - sessionId
    - transaction
    type: object
  api.TransactionPayload:
    properties:
      chainId:
        example: "0x47"
        type: string
      data:
        example: 0x
        type: string
      from:
        type: string
      gas:
        type: string
      gasPrice:
        type: string
      maxFeePerGas:
        type: string
      maxPriorityFeePerGas:
        type: string
      to:
        type: string
      value:
        example: "0x0"
        type: string
    required:
    - chainId
    - from
    - to
    type: object
  api.TransactionResponse:
    properties:
      clientName:
        type: string
      createdAt:
        format: date-time
        type: string
      expiresAt:
        format: date-time
        type: string
      finishedAt:
        format: date-time
        type: string
      handedOffAt:
        format: date-time
        type: string
      id:
        type: string
      intent:
        type: string
      sessionId:
        type: string
      state:
        enum:
        - pending
        - awaiting_wallet
        - sent
        - rejected
        - uncertain
        - canceled
        - expired
        type: string
      transaction:
        $ref: '#/definitions/api.TransactionPayload'
      txHash:
        type: string
    type: object
  api.WalletOperationResponse:
    properties:
      connectionId:
        type: string
      phase:
        enum:
        - ready
        - calling
        - interrupted_calling
        type: string
    type: object
  api.WalletResponse:
    properties:
      kind:
        enum:
        - eip6963
        - legacy
        type: string
      name:
        type: string
      rdns:
        type: string
    type: object
host: 127.0.0.1:18765
info:
  contact: {}
  description: Local service access, browser authorization, client connection/Session
    and transaction lifecycle, browser execution coordination, wallet handoff and
    connection consent.
  title: Wallet Bridge Local API
  version: "1.8"
paths:
  /browser/authorize:
    post:
      consumes:
      - application/json
      description: Requires Origin http://127.0.0.1:18765, including for native HTTP
        callers. The ticket is consumed once; after a failed or lost exchange request
        a new link. Cookie is host-only, HttpOnly, SameSite=Strict, Path=/api/v1,
        with fixed expiration. The HTTP loopback cookie does not use Secure. JSON
        never returns the cookie secret. Request body is limited to 1024 bytes; query
        parameters are rejected.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: One-use ticket from the link fragment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BrowserAuthorizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Persistent browser management cookie
              type: string
          schema:
            $ref: '#/definitions/api.BrowserGrantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Exchange a one-time ticket for browser authorization
  /browser/connections/{id}:
    get:
      description: Requires a valid management cookie. Same-origin GET may omit Origin.
        Any supplied Origin must match the local service. Bearer alone cannot authorize
        this endpoint. Accepts no body or query parameters. Applies the original request
        deadline but never renews a Session, takes execution ownership, or invokes
        a wallet.
      parameters:
      - description: Must match the local service if supplied
        in: header
        name: Origin
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Read a connection for browser review
  /browser/connections/{id}/execution:
    get:
      description: Requires a valid management cookie. Same-origin GET may omit Origin.
        Any supplied Origin must match the local service. Accepts no body or query
        parameters. No execution returns 404 execution_not_found. Reads neither normalize
        stale phases nor acquire ownership or renew heartbeat/Session lifetime; subsequent
        mutations check liveness transactionally. No browser grant ID or secret is
        returned.
      parameters:
      - description: Must match the local service if supplied
        in: header
        name: Origin
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionExecutionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Read the current connection execution
  /browser/connections/{id}/execution/begin:
    post:
      consumes:
      - application/json
      description: 'Newly committed handoff grants invoke once. Retry with the same
        callId and previousCallId after a lost response. Only invoke=true authorizes
        this page to open the wallet. JSON body limit: 1024 bytes. No query parameters.'
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      - description: Begin a wallet call
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionBeginCallRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionCallPermitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Begin a wallet call
  /browser/connections/{id}/execution/claim:
    post:
      consumes:
      - application/json
      description: Requires management cookie and exact local Origin; the cookie supplies
        the browser subject, never the JSON body. Body contains only a fresh execution
        id, limited to 1024 bytes; query parameters are rejected. Retry with the same
        id; a matching retry does not renew heartbeat. Another owner/phase or occupied
        global wallet slot returns 409. Query the original request/execution instead
        of automatically generating a replacement id. Claiming never invokes a wallet
        or creates a Session.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      - description: Page execution ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionExecutionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionExecutionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Claim the connection execution
  /browser/connections/{id}/execution/complete:
    post:
      consumes:
      - application/json
      description: 'Submit after explicit consent with the actual wallet, account
        and network. A matching retry returns the committed connection and Session
        ID. JSON body limit: 8192 bytes. No query parameters.'
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      - description: Confirm a connection with a wallet binding
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionConsentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Confirm a connection with a wallet binding
  /browser/connections/{id}/execution/heartbeat:
    post:
      consumes:
      - application/json
      description: Requires management cookie and exact local Origin. Body contains
        only the current execution id, limited to 1024 bytes; no query parameters.
        Does not extend the connection deadline or Session lifetime. Stale, interrupted,
        replaced or terminal executions cannot be revived by a heartbeat; query after
        a 409.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      - description: Current page execution ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionExecutionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionExecutionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Send an execution heartbeat
  /browser/connections/{id}/execution/interrupt:
    post:
      consumes:
      - application/json
      description: Requires management cookie and exact local Origin. Body contains
        only the current execution id, limited to 1024 bytes; no query parameters.
        Repeating interruption is idempotent. An unfinished wallet handoff remains
        interrupted_calling and occupies the slot; interruption cannot dismiss its
        popup or cancel the connection.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      - description: Current page execution ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionExecutionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionExecutionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Interrupt the current page execution
  /browser/connections/{id}/execution/recover:
    post:
      consumes:
      - application/json
      description: Requires management cookie and exact local Origin. After the user
        ends the previous page/wallet operation, submit a fresh execution id and the
        expected previousId; retry with both unchanged. Body is limited to 1024 bytes;
        no query parameters. An active request gets a new execution and must recheck
        wallet/account/network. A terminal request only clears outstanding waiting
        and returns the original execution as finished; the new id is not installed
        and no Session is created. Old results cannot complete the new execution.
        Recovery does not invoke a wallet.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      - description: Fresh ID and expected previous execution ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionExecutionRecoverRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionExecutionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Explicitly continue an interrupted execution
  /browser/connections/{id}/execution/reject:
    post:
      consumes:
      - application/json
      description: 'Reject using the current ready execution. A matching replay returns
        the committed rejection. JSON body limit: 1024 bytes. No query parameters.'
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      - description: Reject the connection
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionExecutionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Reject the connection
  /browser/connections/{id}/execution/return:
    post:
      consumes:
      - application/json
      description: 'Return the same callId after the wallet promise settles. A return
        never grants consent or establishes a Session. JSON body limit: 1024 bytes.
        No query parameters.'
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: 32-character lowercase hexadecimal connection ID
        in: path
        name: id
        required: true
        type: string
      - description: Record that the wallet call ended
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionReturnCallRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionExecutionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Record that the wallet call ended
  /browser/logout:
    post:
      consumes:
      - application/json
      description: Requires the browser cookie and exact local Origin, even when a
        Bearer token is also present. Revokes the persistent grant before expiring
        its cookie. Accepts no body or an empty JSON object, limited to 1024 bytes;
        query parameters are rejected.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Expires the current browser management cookie
              type: string
          schema:
            $ref: '#/definitions/api.BrowserRevokeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Log out the current browser
  /connections:
    post:
      consumes:
      - application/json
      description: Requires the service Bearer, never a browser cookie. Generate a
        32-character lowercase hexadecimal ID once and reuse it for transport retries.
        Matching content returns the original state and deadline; changed content
        returns 409. Both creation and replay return 200, which does not imply user
        consent. chainId must be a decimal or 0x hexadecimal string, never a JSON
        number. Body limit is 8192 bytes. Query parameters and unknown fields are
        rejected. No browser link or wallet invocation is provided by this endpoint.
      parameters:
      - description: Immutable connection input
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Create or retry a connection request
  /connections/{id}:
    get:
      description: Requires the service Bearer. No body or query parameters. Expired
        pending requests become expired; reads never renew the resulting Session.
        On success, use sessionId to explicitly access the fixed wallet/account/network
        through GET /sessions/{id}. A terminal request remains queryable after Session
        closure.
      parameters:
      - description: 32-character lowercase hexadecimal request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Read connection status and result
  /connections/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Requires the service Bearer. Accepts no body or an empty JSON object,
        limited to 1024 bytes; no query parameters. Repeated cancellation preserves
        the original result. A different terminal outcome, including expiry, returns
        409; query the original ID to reconcile. This does not close an existing Session
        or dismiss a wallet popup.
      parameters:
      - description: 32-character lowercase hexadecimal request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Cancel a pending connection request
  /control/browser-grants:
    get:
      description: Requires the local service token; browser cookies cannot list grants.
        Includes active, expired and revoked records, newest first. The cursor is
        the last grant ID from the preceding page. Secrets and their digests are never
        returned.
      parameters:
      - description: Page size (default 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Last grant ID of the preceding page
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BrowserGrantListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: List browser authorizations
    post:
      consumes:
      - application/json
      description: Requires the local service token. The URL contains a two-minute,
        one-use secret in its fragment. Do not log or expose it in ordinary status
        output. Accepts no body or an empty JSON object.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.BrowserTicketResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Issue a browser authorization link
  /control/browser-grants/revoke:
    post:
      consumes:
      - application/json
      description: Requires the local service token. Choose a single grant id or all=true,
        exclusively. Repeating revocation of an existing record succeeds without changing
        its first revocation time. Revoke-all also invalidates all outstanding authorization
        links. Request body is limited to 1024 bytes; query parameters are rejected.
      parameters:
      - description: Grant ID or all=true
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BrowserRevokeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BrowserRevokeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Revoke browser authorization
  /control/stop:
    post:
      consumes:
      - application/json
      description: Requires the local service token. Accepts no body or an empty JSON
        object, limited to 1024 bytes. HTTP 202 means shutdown was requested, not
        that the process has exited.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/api.StopResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
