          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Request graceful service shutdown
  /info:
    get:
      description: A 64-character lowercase hexadecimal challenge produces an HMAC-SHA256
        proof binding the response metadata. No credentials or data directory are
        returned.
      parameters:
      - description: 32-byte nonce encoded as lowercase hexadecimal
        in: query
        maxLength: 64
        minLength: 64
        name: challenge
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.InfoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Read service version and capabilities
  /sessions/{id}:
    get:
      description: Requires the service Bearer. No body or query parameters. Only
        an active Session renews its five-minute idle time. Expired or explicitly
        closed records return state=closed with their original fixed binding and closure
        time; reading never revives them. GET /connections/{id} does not renew this
        idle time.
      parameters:
      - description: 32-character lowercase hexadecimal Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Access a Session or its closed history
  /sessions/{id}/close:
    post:
      consumes:
      - application/json
      description: Requires the service Bearer. Accepts no body or an empty JSON object,
        limited to 1024 bytes; no query parameters. Closure is idempotent and does
        not delete history. A Session cannot be created or rebound by this endpoint.
      parameters:
      - description: 32-character lowercase hexadecimal Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Close a Session
  /status:
    get:
      description: With an active browser cookie, activeWalletRequest identifies the
        connection or transaction occupying the wallet. For connections, walletOperation
        also supplies the API 1.6 representation. Both fields are omitted for an idle
        wallet and for service Bearer callers. Reading status does not renew or acquire
        an execution.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      - BrowserCookie: []
      summary: Read authenticated service status
  /transactions:
    post:
      consumes:
      - application/json
      description: Reuse the request ID for retries. Matching normalized content returns
        the original record and deadline. A changed request with that ID returns 409.
        Amounts and fees are strings in smallest units, in decimal or 0x hexadecimal.
        Omitted value and data default to zero and empty bytes. Omit fees for wallet
        estimation. The JSON body limit is 1 MiB.
      parameters:
      - description: Caller metadata and transaction for a fixed Session
        in: body
        name: request
        required: true
        schema:
          allOf:
          - $ref: '#/definitions/api.TransactionCreateRequest'
          - properties:
              transaction:
                $ref: '#/definitions/api.TransactionPayload'
            type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Create or retry a transaction request
  /transactions/{id}:
    get:
      description: Reads the original request without renewing its deadline or Session.
        A late wallet reply can update an uncertain result. A transaction hash identifies
        a submitted transaction. The client can use the chain ID and hash to query
        a receipt.
      parameters:
      - description: 32-character lowercase hexadecimal request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Read the transaction and its latest result
  /transactions/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Accepts an empty body or an empty JSON object. Returns the effective
        state, including expiry or an earlier wallet handoff. Check state before treating
        the transaction as canceled.
      parameters:
      - description: 32-character lowercase hexadecimal request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Cancel a transaction awaiting approval
schemes:
- http
securityDefinitions:
  BrowserCookie:
    description: Swagger 2.0 represents this cookie as a header. Use wallet_bridge_browser=<secret>.
      Browser connection mutations require the exact local Origin. Reads may omit
      it. Browser clients receive the cookie through Set-Cookie, never through JSON.
    in: header
    name: Cookie
    type: apiKey
  ServiceBearer:
    description: Bearer token from the current user's client.key, shared by trusted
      local clients for service access and management.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
