basePath: /api/v1
definitions:
  api.APIVersion:
    properties:
      major:
        example: 1
        type: integer
      minor:
        example: 1
        type: integer
    type: object
  api.BrowserAuthorizeRequest:
    properties:
      ticket:
        type: string
    type: object
  api.BrowserGrantListResponse:
    properties:
      grants:
        items:
          $ref: '#/definitions/api.BrowserGrantResponse'
        type: array
      nextAfter:
        type: string
    type: object
  api.BrowserGrantResponse:
    properties:
      expiresAt:
        format: date-time
        type: string
      id:
        type: string
      issuedAt:
        format: date-time
        type: string
      revokedAt:
        format: date-time
        type: string
      state:
        enum:
        - active
        - expired
        - revoked
        - not_yet_valid
        type: string
    type: object
  api.BrowserRevokeRequest:
    properties:
      all:
        type: boolean
      id:
        type: string
    type: object
  api.BrowserRevokeResponse:
    properties:
      state:
        example: revoked
        type: string
    type: object
  api.BrowserTicketResponse:
    properties:
      expiresAt:
        format: date-time
        type: string
      url:
        type: string
    type: object
  api.ErrorResponse:
    properties:
      code:
        example: unauthenticated
        type: string
      message:
        example: A valid Bearer token is required
        type: string
    type: object
  api.InfoResponse:
    properties:
      apiVersion:
        $ref: '#/definitions/api.APIVersion'
      capabilities:
        example:
        - service.status
        - service.stop
        - browser.authorization
        items:
          type: string
        type: array
      challenge:
        type: string
      name:
        example: wallet-bridge
        type: string
      proof:
        type: string
      ready:
        example: true
        type: boolean
      version:
        example: dev
        type: string
    type: object
  api.StatusResponse:
    properties:
      browser:
        $ref: '#/definitions/api.BrowserGrantResponse'
      info:
        $ref: '#/definitions/api.InfoResponse'
      startedAt:
        format: date-time
        type: string
      state:
        example: running
        type: string
    type: object
  api.StopResponse:
    properties:
      state:
        example: stopping
        type: string
    type: object
host: 127.0.0.1:18765
info:
  contact: {}
  description: Local service access and browser authorization. Wallet APIs are delivered
    in later iterations.
  title: Wallet Bridge Local API
  version: "1.1"
paths:
  /browser/authorize:
    post:
      consumes:
      - application/json
      description: Requires Origin http://127.0.0.1:18765, including for native HTTP
        callers. The ticket is consumed once; after a failed or lost exchange request
        a new link. Cookie is host-only, HttpOnly, SameSite=Strict, Path=/api/v1,
        with fixed expiration. The HTTP loopback cookie does not use Secure. JSON
        never returns the cookie secret. Request body is limited to 1024 bytes; query
        parameters are rejected.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: One-use ticket from the link fragment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BrowserAuthorizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Persistent browser management cookie
              type: string
          schema:
            $ref: '#/definitions/api.BrowserGrantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Exchange a one-time ticket for browser authorization
  /browser/logout:
    post:
      consumes:
      - application/json
      description: Requires the browser cookie and exact local Origin, even when a
        Bearer token is also present. Revokes the persistent grant before expiring
        its cookie. Accepts no body or an empty JSON object, limited to 1024 bytes;
        query parameters are rejected.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Expires the current browser management cookie
              type: string
          schema:
            $ref: '#/definitions/api.BrowserRevokeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Log out the current browser
  /control/browser-grants:
    get:
      description: Includes active, expired and revoked records, newest first. The
        cursor is the last grant ID from the preceding page. Browser cookies and client
        tokens cannot list grants. Secrets and their digests are never returned.
      parameters:
      - description: Page size (default 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Last grant ID of the preceding page
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BrowserGrantListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ControlBearer: []
      summary: List browser authorizations
    post:
      consumes:
      - application/json
      description: Only the control token can issue links. The URL contains a two-minute,
        one-use secret in its fragment. Do not log or expose it in ordinary status
        output. Accepts no body or an empty JSON object.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.BrowserTicketResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ControlBearer: []
      summary: Issue a browser authorization link
  /control/browser-grants/revoke:
    post:
      consumes:
      - application/json
      description: Requires the control token. Choose a single grant id or all=true,
        exclusively. Repeating revocation of an existing record succeeds without changing
        its first revocation time. Revoke-all also invalidates all outstanding authorization
        links. Request body is limited to 1024 bytes; query parameters are rejected.
      parameters:
      - description: Grant ID or all=true
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BrowserRevokeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BrowserRevokeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ControlBearer: []
      summary: Revoke browser authorization
  /control/stop:
    post:
      consumes:
      - application/json
      description: Requires the control token. Accepts no body or an empty JSON object,
        limited to 1024 bytes. HTTP 202 means shutdown was requested, not that the
        process has exited.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/api.StopResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ControlBearer: []
      summary: Request graceful service shutdown
  /info:
    get:
      description: A 64-character lowercase hexadecimal challenge produces an HMAC-SHA256
        proof binding the response metadata. No credentials or data directory are
        returned.
      parameters:
      - description: 32-byte nonce encoded as lowercase hexadecimal
        in: query
        maxLength: 64
        minLength: 64
        name: challenge
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.InfoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Read service version and capabilities
  /status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ClientBearer: []
      - ControlBearer: []
      - BrowserCookie: []
      summary: Read authenticated service status
schemes:
- http
securityDefinitions:
  BrowserCookie:
    description: Swagger 2.0 represents this cookie as a header. Use wallet_bridge_browser=<secret>;
      only browser status and logout accept it. Browser clients receive it through
      Set-Cookie, never through JSON.
    in: header
    name: Cookie
    type: apiKey
  ClientBearer:
    description: Bearer token from the current user's client.key.
    in: header
    name: Authorization
    type: apiKey
  ControlBearer:
    description: Bearer token from the current user's control.key; required for administrative
      operations.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
