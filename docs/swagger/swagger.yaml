basePath: /api/v1
definitions:
  api.APIVersion:
    properties:
      major:
        example: 1
        type: integer
      minor:
        example: 3
        type: integer
    type: object
  api.BrowserAuthorizeRequest:
    properties:
      ticket:
        type: string
    type: object
  api.BrowserGrantListResponse:
    properties:
      grants:
        items:
          $ref: '#/definitions/api.BrowserGrantResponse'
        type: array
      nextAfter:
        type: string
    type: object
  api.BrowserGrantResponse:
    properties:
      expiresAt:
        format: date-time
        type: string
      id:
        type: string
      issuedAt:
        format: date-time
        type: string
      revokedAt:
        format: date-time
        type: string
      state:
        enum:
        - active
        - expired
        - revoked
        - not_yet_valid
        type: string
    type: object
  api.BrowserRevokeRequest:
    properties:
      all:
        type: boolean
      id:
        type: string
    type: object
  api.BrowserRevokeResponse:
    properties:
      state:
        example: revoked
        type: string
    type: object
  api.BrowserTicketResponse:
    properties:
      expiresAt:
        format: date-time
        type: string
      url:
        type: string
    type: object
  api.ConnectionCreateRequest:
    properties:
      chainId:
        example: "71"
        type: string
      chainName:
        type: string
      clientName:
        example: Example CLI
        type: string
      id:
        type: string
      intent:
        type: string
    required:
    - chainId
    - clientName
    - id
    type: object
  api.ConnectionResponse:
    properties:
      chainId:
        example: "0x47"
        type: string
      chainName:
        type: string
      clientName:
        type: string
      createdAt:
        format: date-time
        type: string
      expiresAt:
        format: date-time
        type: string
      finishedAt:
        format: date-time
        type: string
      id:
        type: string
      intent:
        type: string
      sessionId:
        type: string
      state:
        enum:
        - pending
        - succeeded
        - rejected
        - canceled
        - expired
        type: string
    type: object
  api.ErrorResponse:
    properties:
      code:
        example: unauthenticated
        type: string
      message:
        example: A valid Bearer token is required
        type: string
    type: object
  api.InfoResponse:
    properties:
      apiVersion:
        $ref: '#/definitions/api.APIVersion'
      capabilities:
        example:
        - service.status
        - service.stop
        - browser.authorization
        - service.auth.shared
        - connections.lifecycle
        items:
          type: string
        type: array
      challenge:
        type: string
      name:
        example: wallet-bridge
        type: string
      proof:
        type: string
      ready:
        example: true
        type: boolean
      version:
        example: dev
        type: string
    type: object
  api.SessionResponse:
    properties:
      account:
        type: string
      chainId:
        example: "0x47"
        type: string
      closedAt:
        format: date-time
        type: string
      connectionId:
        type: string
      createdAt:
        format: date-time
        type: string
      id:
        type: string
      lastAccessAt:
        format: date-time
        type: string
      state:
        enum:
        - active
        - closed
        type: string
      wallet:
        $ref: '#/definitions/api.WalletResponse'
    type: object
  api.StatusResponse:
    properties:
      browser:
        $ref: '#/definitions/api.BrowserGrantResponse'
      info:
        $ref: '#/definitions/api.InfoResponse'
      startedAt:
        format: date-time
        type: string
      state:
        example: running
        type: string
    type: object
  api.StopResponse:
    properties:
      state:
        example: stopping
        type: string
    type: object
  api.WalletResponse:
    properties:
      kind:
        enum:
        - eip6963
        - legacy
        type: string
      name:
        type: string
      rdns:
        type: string
    type: object
host: 127.0.0.1:18765
info:
  contact: {}
  description: Local service access, browser authorization and client connection/Session
    lifecycle. Browser wallet execution endpoints are delivered separately.
  title: Wallet Bridge Local API
  version: "1.3"
paths:
  /browser/authorize:
    post:
      consumes:
      - application/json
      description: Requires Origin http://127.0.0.1:18765, including for native HTTP
        callers. The ticket is consumed once; after a failed or lost exchange request
        a new link. Cookie is host-only, HttpOnly, SameSite=Strict, Path=/api/v1,
        with fixed expiration. The HTTP loopback cookie does not use Secure. JSON
        never returns the cookie secret. Request body is limited to 1024 bytes; query
        parameters are rejected.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      - description: One-use ticket from the link fragment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BrowserAuthorizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Persistent browser management cookie
              type: string
          schema:
            $ref: '#/definitions/api.BrowserGrantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Exchange a one-time ticket for browser authorization
  /browser/logout:
    post:
      consumes:
      - application/json
      description: Requires the browser cookie and exact local Origin, even when a
        Bearer token is also present. Revokes the persistent grant before expiring
        its cookie. Accepts no body or an empty JSON object, limited to 1024 bytes;
        query parameters are rejected.
      parameters:
      - description: Exact local service origin
        in: header
        name: Origin
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: Expires the current browser management cookie
              type: string
          schema:
            $ref: '#/definitions/api.BrowserRevokeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BrowserCookie: []
      summary: Log out the current browser
  /connections:
    post:
      consumes:
      - application/json
      description: Requires the service Bearer, never a browser cookie. Generate a
        32-character lowercase hexadecimal ID once and reuse it for transport retries.
        Matching content returns the original state and deadline; changed content
        returns 409. Both creation and replay return 200, which does not imply user
        consent. chainId must be a decimal or 0x hexadecimal string, never a JSON
        number. Body limit is 8192 bytes. Query parameters and unknown fields are
        rejected. No browser link or wallet invocation is provided by this endpoint.
      parameters:
      - description: Immutable connection input
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.ConnectionCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Create or retry a connection request
  /connections/{id}:
    get:
      description: Requires the service Bearer. No body or query parameters. Expired
        pending requests become expired; reads never renew the resulting Session.
        On success, use sessionId to explicitly access the fixed wallet/account/network
        through GET /sessions/{id}. A terminal request remains queryable after Session
        closure.
      parameters:
      - description: 32-character lowercase hexadecimal request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Read connection status and result
  /connections/{id}/cancel:
    post:
      consumes:
      - application/json
      description: Requires the service Bearer. Accepts no body or an empty JSON object,
        limited to 1024 bytes; no query parameters. Repeated cancellation preserves
        the original result. A different terminal outcome, including expiry, returns
        409; query the original ID to reconcile. This does not close an existing Session
        or dismiss a wallet popup.
      parameters:
      - description: 32-character lowercase hexadecimal request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Cancel a pending connection request
  /control/browser-grants:
    get:
      description: Requires the local service token; browser cookies cannot list grants.
        Includes active, expired and revoked records, newest first. The cursor is
        the last grant ID from the preceding page. Secrets and their digests are never
        returned.
      parameters:
      - description: Page size (default 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Last grant ID of the preceding page
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BrowserGrantListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: List browser authorizations
    post:
      consumes:
      - application/json
      description: Requires the local service token. The URL contains a two-minute,
        one-use secret in its fragment. Do not log or expose it in ordinary status
        output. Accepts no body or an empty JSON object.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.BrowserTicketResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Issue a browser authorization link
  /control/browser-grants/revoke:
    post:
      consumes:
      - application/json
      description: Requires the local service token. Choose a single grant id or all=true,
        exclusively. Repeating revocation of an existing record succeeds without changing
        its first revocation time. Revoke-all also invalidates all outstanding authorization
        links. Request body is limited to 1024 bytes; query parameters are rejected.
      parameters:
      - description: Grant ID or all=true
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BrowserRevokeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.BrowserRevokeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Revoke browser authorization
  /control/stop:
    post:
      consumes:
      - application/json
      description: Requires the local service token. Accepts no body or an empty JSON
        object, limited to 1024 bytes. HTTP 202 means shutdown was requested, not
        that the process has exited.
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/api.StopResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Request graceful service shutdown
  /info:
    get:
      description: A 64-character lowercase hexadecimal challenge produces an HMAC-SHA256
        proof binding the response metadata. No credentials or data directory are
        returned.
      parameters:
      - description: 32-byte nonce encoded as lowercase hexadecimal
        in: query
        maxLength: 64
        minLength: 64
        name: challenge
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.InfoResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Read service version and capabilities
  /sessions/{id}:
    get:
      description: Requires the service Bearer. No body or query parameters. Only
        an active Session renews its five-minute idle time. Expired or explicitly
        closed records return state=closed with their original fixed binding and closure
        time; reading never revives them. GET /connections/{id} does not renew this
        idle time.
      parameters:
      - description: 32-character lowercase hexadecimal Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Access a Session or its closed history
  /sessions/{id}/close:
    post:
      consumes:
      - application/json
      description: Requires the service Bearer. Accepts no body or an empty JSON object,
        limited to 1024 bytes; no query parameters. Closure is idempotent and does
        not delete history. A Session cannot be created or rebound by this endpoint.
      parameters:
      - description: 32-character lowercase hexadecimal Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      summary: Close a Session
  /status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.StatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - ServiceBearer: []
      - BrowserCookie: []
      summary: Read authenticated service status
schemes:
- http
securityDefinitions:
  BrowserCookie:
    description: Swagger 2.0 represents this cookie as a header. Use wallet_bridge_browser=<secret>;
      only browser status and logout accept it. Browser clients receive it through
      Set-Cookie, never through JSON.
    in: header
    name: Cookie
    type: apiKey
  ServiceBearer:
    description: Bearer token from the current user's client.key, shared by trusted
      local clients for service access and management.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
